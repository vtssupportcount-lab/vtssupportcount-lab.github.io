<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini Web Browser</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    .toolbar {
      display: flex;
      gap: 8px;
      padding: 10px;
      background: #f1f3f4;
      border-bottom: 1px solid #ccc;
    }
    button {
      padding: 6px 12px;
      cursor: pointer;
    }
    input {
      flex: 1;
      padding: 6px 10px;
      font-size: 16px;
    }
    iframe {
      flex: 1;
      border: none;
      width: 100%;
    }
  </style>
</head>
<body>
  <div class="toolbar">
    <button onclick="goBack()">←</button>
    <button onclick="goForward()">→</button>
    <button onclick="reloadPage()">↻</button>
    <input type="text" id="urlInput" placeholder="Enter URL (e.g., https://bing.com)" value="https://bing.com">
    <button onclick="loadUrl()">Go</button>
  </div>

  <iframe id="browserFrame" src="https://example.com"></iframe>

  <script>
    const frame = document.getElementById('browserFrame');
    const urlInput = document.getElementById('urlInput');

    function loadUrl() {
      let url = urlInput.value.trim();
      if (!url.startsWith('http://') && !url.startsWith('https://')) {
        url = 'https://' + url;
      }
      urlInput.value = url;
      frame.src = url;
    }

    function goBack() {
      history.back();
    }

    function goForward() {
      history.forward();
    }

    function reloadPage() {
      frame.src = frame.src;
    }

    urlInput.addEventListener('keypress', function (e) {
      if (e.key === 'Enter') loadUrl();
    });
  </script>
</body>
</html>
